name: Pre-commit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  pre-commit:
    name: Pre Commit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Full history so Gitleaks can scan the repository, not just a staged diff.
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up virtual env
      run: uv venv --python ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        uv pip install -e ".[dev]"

    - name: Run Pre Commit
      run: |
        source .venv/bin/activate && pre-commit run --all-files

    # The gitleaks pre-commit hook only scans staged changes; CI has none.
    # Run a full-repository scan here for defense in depth.
    - name: Gitleaks (full repository)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
