apiVersion: v1
kind: ConfigMap
metadata:
  name: template-mcp-server-config
  labels:
    app: template-mcp-server
    component: mcp-server
data:
  MCP_PORT: "5001"
  PYTHON_LOG_LEVEL: "INFO"
  MCP_TRANSPORT_PROTOCOL: "streamable-http"
  CORS_ENABLED: "true"
  ENVIRONMENT: "production"
  ENABLE_AUTH: "false"
  MCP_STATELESS_HTTP: "true"
  MCP_PROTOCOL_VERSION: "2026-07-28"
  MCP_TRACE_CONTEXT_ENABLED: "true"
  MCP_EXTENSIONS_ENABLED: "true"
  SSO_CALLBACK_URL: ""
  SSO_AUTHORIZATION_URL: ""
  SSO_TOKEN_URL: ""
  SSO_INTROSPECTION_URL: ""
  MCP_HOST_ENDPOINT: ""
