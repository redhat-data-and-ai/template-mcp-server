apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: template-agent

resources:
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml

labels:
  - pairs:
      app: template-mcp-server
      component: mcp-server
    includeSelectors: true

images:
  - name: template-mcp-server
    newName: localhost/template-mcp-server
    newTag: local
